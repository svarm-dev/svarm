name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: mix ci
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      # Phoenix / LiveView tests; value is not secret in CI
      SECRET_KEY_BASE: "0123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.2"
          otp-version: "29"

      - name: Cache deps and build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Cache Dialyzer PLT
        uses: actions/cache@v6
        with:
          path: _build/test/*_plt*
          key: ${{ runner.os }}-plt-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-

      - name: Install dependencies
        run: mix deps.get

      - name: Run mix ci
        run: mix ci

  # The image is what operators and agents actually run, and the Elixir tests
  # never touch it: a runtime stage missing Elixir stdlib apps or a compiler
  # used to ship with every check green. Build the image and prove the release
  # plus the agent toolchain work inside it.
  docker:
    name: docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: svarm:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the agent toolchain
        run: |
          docker run --rm --entrypoint sh \
            -v "$PWD/docker/smoke-test.sh:/tmp/smoke-test.sh:ro" \
            svarm:ci /tmp/smoke-test.sh

      - name: Boot the release and check /health
        run: |
          set -euo pipefail
          docker run -d --name svarm-ci -p 4000:4000 svarm:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:4000/health >/dev/null; then
              echo "health ok"
              exit 0
            fi
            sleep 2
          done
          echo "health check failed" >&2
          docker logs svarm-ci >&2
          exit 1
