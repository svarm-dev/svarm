version: 2
updates:
  # Patch bumps land in one PR; minor/major stay separate for review.
  - package-ecosystem: mix
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      hex-patches:
        patterns:
          - "*"
        update-types:
          - "patch"

  # All Actions pin bumps in one monthly PR.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
