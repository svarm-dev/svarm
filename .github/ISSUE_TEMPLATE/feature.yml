name: Feature request
description: Product idea or improvement — not yet a claimable build ticket
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        For ideas and external suggestions. Maintainers turn accepted work into **Ready to build** (or an **Epic**) before coding.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Optional — how you think it could work
  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: How this fits Svärm (self-hosted control plane for coding agents)
    validations:
      required: true
