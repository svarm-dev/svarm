name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What you expected to happen
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What actually happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: As specific as possible
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: "OS, Elixir, OTP (and Docker vs Mix if relevant)"
      placeholder: "Ubuntu 26.04 · Elixir 1.20.2 · OTP 29 · Mix"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Extra context
      description: Board state, mix svarm.demo output, logs (no secrets)
