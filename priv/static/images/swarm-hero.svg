<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" fill="none" aria-hidden="true">
  <!--
    Svärm hero flock — low-poly birds for landing.
    Use behind wordmark: position absolute, low opacity, pointer-events none.
    Soft moss palette; denser toward upper-right flight path.
  -->
  <defs>
    <!-- Reusable low-poly bird: apex = head direction (flight to the right) -->
    <symbol id="bird" viewBox="0 0 12 8">
      <path d="M6 1.2 L10.5 5.2 L6 4 L1.5 5.2 Z"/>
    </symbol>
  </defs>

  <g fill="#3d8f6a">
    <!-- distant / small -->
    <use href="#bird" x="520" y="28" width="10" height="7" opacity="0.25"/>
    <use href="#bird" x="548" y="42" width="9" height="6" opacity="0.22"/>
    <use href="#bird" x="575" y="24" width="11" height="7" opacity="0.28"/>
    <use href="#bird" x="600" y="48" width="8" height="5" opacity="0.2"/>
    <use href="#bird" x="490" y="55" width="9" height="6" opacity="0.22"/>
    <use href="#bird" x="630" y="36" width="10" height="7" opacity="0.18"/>

    <!-- mid field -->
    <use href="#bird" x="380" y="70" width="14" height="9" opacity="0.4"/>
    <use href="#bird" x="410" y="88" width="12" height="8" opacity="0.38"/>
    <use href="#bird" x="445" y="62" width="15" height="10" opacity="0.45"/>
    <use href="#bird" x="470" y="95" width="13" height="9" opacity="0.35"/>
    <use href="#bird" x="500" y="78" width="14" height="9" opacity="0.42"/>
    <use href="#bird" x="350" y="100" width="12" height="8" opacity="0.32"/>
    <use href="#bird" x="425" y="115" width="11" height="7" opacity="0.3"/>
    <use href="#bird" x="530" y="100" width="12" height="8" opacity="0.34"/>

    <!-- near core (behind title area, center-left → right) -->
    <use href="#bird" x="200" y="110" width="18" height="12" opacity="0.55"/>
    <use href="#bird" x="240" y="130" width="16" height="11" opacity="0.5"/>
    <use href="#bird" x="275" y="105" width="20" height="13" opacity="0.65"/>
    <use href="#bird" x="310" y="140" width="15" height="10" opacity="0.48"/>
    <use href="#bird" x="340" y="118" width="17" height="11" opacity="0.58"/>
    <use href="#bird" x="180" y="145" width="14" height="9" opacity="0.4"/>
    <use href="#bird" x="290" y="155" width="16" height="11" opacity="0.45"/>
    <use href="#bird" x="360" y="155" width="14" height="9" opacity="0.42"/>

    <!-- lower trail -->
    <use href="#bird" x="150" y="175" width="13" height="9" opacity="0.28"/>
    <use href="#bird" x="220" y="185" width="12" height="8" opacity="0.26"/>
    <use href="#bird" x="260" y="200" width="11" height="7" opacity="0.22"/>
    <use href="#bird" x="320" y="190" width="13" height="9" opacity="0.3"/>
    <use href="#bird" x="400" y="175" width="12" height="8" opacity="0.28"/>
    <use href="#bird" x="460" y="160" width="11" height="7" opacity="0.24"/>

    <!-- a few darker moss accents for depth -->
    <g fill="#347a5b">
      <use href="#bird" x="295" y="95" width="22" height="14" opacity="0.7"/>
      <use href="#bird" x="255" y="125" width="15" height="10" opacity="0.55"/>
      <use href="#bird" x="335" y="125" width="16" height="11" opacity="0.6"/>
    </g>
  </g>
</svg>
