# Svärm provider registry.
# Advertised (live) rows are the source of truth for in-app LLM resolve.
# Auth tokens come from Settings (`provider.<id>` api_key) or the operator's
# environment — never hardcode secrets here.
# Commented Anthropic/OpenAI stubs stay stubs and are not advertised.

[provider.openrouter]
adapter = "openrouter"
auth_env = "OPENROUTER_API_KEY"
base_url = "https://openrouter.ai/api/v1"
default_model = "openrouter/free"

[provider.opencode-go]
adapter = "openai_compat"
auth_env = "OPENCODE_API_KEY"
base_url = "https://opencode.ai/zen/go/v1"
# Default stays chat/completions. MiniMax + Qwen speak Anthropic /messages
# (OpenCode Go docs). Prefixes; ids churn — check those docs.
default_model = "glm-5.3-flash"
messages_models = ["minimax-", "qwen"]
incomplete_prefixes = ["gpt-", "grok-", "muse-spark-"]

[provider.opencode]
adapter = "openai_compat"
auth_env = "OPENCODE_API_KEY"
base_url = "https://opencode.ai/zen/v1"
# Zen MiniMax + qwen3.8-max stay chat/completions; other Qwen ids are /messages.
default_model = "kimi-k2.6"
messages_models = ["qwen"]
chat_models = ["qwen3.8-max"]
incomplete_prefixes = ["gpt-", "grok-", "muse-spark-", "gemini-", "jev-", "claude-"]

