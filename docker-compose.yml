# Svärm Docker Compose
#
# A) Demo (no API keys; .env optional):
#    docker compose --profile demo up --build
#    SECRET_KEY_BASE is auto-generated if unset; set .env to keep it across restarts
#    -> http://localhost:4000/board  (seeded automatically)
#
# B) Real loop (GitHub + pi + OpenRouter):
#    cp .env.example .env  ->  SECRET_KEY_BASE + GITHUB_TOKEN + OPENROUTER_API_KEY
#    docker compose --profile app up --build
#    Edit svarm-config/WORKFLOW.md (created on first boot): kind: github, owner, repo
#    -> http://localhost:4000/board ; approve once at /approvals
#
# Config dir is mounted as a directory (not individual files) so missing host
# files never become Docker-created directories named WORKFLOW.md.
# Profiles are mutually exclusive so demo and app never fight over port 4000.

services:
  svarm:
    profiles: ["app"]
    build: .
    ports:
      - "${SVARM_PORT:-4000}:4000"
    env_file:
      - path: .env
        required: false
    environment:
      - SVARM_DB_PATH=/app/data/kanban.db
      - SVARM_CONFIG_DIR=/app/config
      - SVARM_WORKFLOW_PATH=/app/config/WORKFLOW.md
      - SVARM_AGENTS_PATH=/app/config/agents.toml
      - PHX_HOST=${PHX_HOST:-localhost}
      # Session Secure defaults true in prod runtime. For plain-HTTP localhost
      # with this profile, set PHX_SECURE_COOKIES=false in .env (demo sets false).
      - SVARM_BASE_URL=${SVARM_BASE_URL:-http://localhost:${SVARM_PORT:-4000}}
    volumes:
      - ./data:/app/data
      - ./svarm-config:/app/config
    restart: unless-stopped

  # Zero-key path: same image, auto-seed + optional re-seed button, no GitHub/OpenRouter.
  svarm-demo:
    profiles: ["demo"]
    build: .
    ports:
      - "${SVARM_PORT:-4000}:4000"
    env_file:
      - path: .env
        required: false
    environment:
      - SVARM_DB_PATH=/app/data/kanban.db
      - SVARM_CONFIG_DIR=/app/config
      - SVARM_WORKFLOW_PATH=/app/config/WORKFLOW.md
      - SVARM_AGENTS_PATH=/app/config/agents.toml
      - PHX_HOST=${PHX_HOST:-localhost}
      # Plain HTTP on localhost: allow non-Secure session cookies (prod defaults Secure).
      - PHX_SECURE_COOKIES=${PHX_SECURE_COOKIES:-false}
      - SVARM_BASE_URL=${SVARM_BASE_URL:-http://localhost:${SVARM_PORT:-4000}}
      - SVARM_SEED_DEMO=1
      # Re-seed button + /dev/demo/seed (explicit; not implied by SEED alone).
      - SVARM_DEMO_ROUTES=1
      # Demo: research/docs trusted, demo_code gated (runtime overlay). Basic Auth for /approvals.
      - APPROVALS_USER=${APPROVALS_USER:-svarm}
      - APPROVALS_PASSWORD=${APPROVALS_PASSWORD:-svarm}
    volumes:
      - ./data:/app/data
      - ./svarm-config:/app/config
    restart: unless-stopped
