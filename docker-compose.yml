# Svärm — Docker Compose
# 1. cp .env.example .env  →  set SECRET_KEY_BASE (openssl rand -base64 48) + API keys
# 2. mkdir -p svarm-config
#    cp priv/workflow_template.md svarm-config/WORKFLOW.md
#    cp priv/agents.toml svarm-config/agents.toml
#    → edit WORKFLOW owner/repo (and kind: github for real issues)
# 3. docker compose up --build  →  http://localhost:4000/board
# 4. Approve once at http://localhost:4000/approvals (default approval.mode: untrusted)
#
services:
  svarm:
    build: .
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      - SVARM_DB_PATH=/app/data/kanban.db
      - SVARM_WORKFLOW_PATH=/app/config/WORKFLOW.md
      - SVARM_AGENTS_PATH=/app/config/agents.toml
    volumes:
      - ./data:/app/data
      - ./svarm-config/WORKFLOW.md:/app/config/WORKFLOW.md:ro
      - ./svarm-config/agents.toml:/app/config/agents.toml:ro
    restart: unless-stopped
